# Ruff -- the Python linter CI runs on every push and PR.
#
# Deliberately a short rule list: things that are bugs, not matters of taste.
# A linter that flags hundreds of style nits gets switched off; one that only
# speaks up about real problems gets listened to.

target-version = "py311"

[lint]
select = [
    "E4", "E7", "E9",  # Ruff's defaults: import placement, statements, syntax errors
    "F",               # Pyflakes: undefined names, unused imports and variables
    "B",               # flake8-bugbear: patterns that are usually bugs
]
ignore = [
    # Function calls in argument defaults. Usually a bug -- but it is exactly
    # how FastAPI's Depends(), Query() and Body() are meant to be used.
    "B008",
]
