# Stale bot — keeps the issue and PR lists honest.
#
# Anything with no activity for 60 days gets a `stale` label and a comment;
# 14 days after that, with still no activity, it is closed. Any comment or push
# removes the label and resets the clock. Pinned, security and in-progress
# work, and draft PRs, are never touched.

name: Stale

on:
  schedule:
    - cron: "30 1 * * *"   # daily, 01:30 UTC
  workflow_dispatch:

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,in-progress
          exempt-pr-labels: pinned,security,in-progress
          exempt-draft-pr: true
          stale-issue-message: >
            This issue has had no activity for 60 days, so it has been marked
            stale. It will close in 14 days unless there is new activity --
            any comment keeps it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days, so it has been
            marked stale. It will close in 14 days unless there is new
            activity -- a comment or a push keeps it open.
          close-issue-message: Closed after 74 days without activity. Reopen it any time if it is still relevant.
          close-pr-message: Closed after 74 days without activity. Reopen it any time if it is still relevant.
