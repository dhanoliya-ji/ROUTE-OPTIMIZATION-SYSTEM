# Welcome bot — thanks someone the first time they open an issue or a PR here.

name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  greet:
    name: Greet first-time contributors
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          issue_message: |
            👋 Thanks for opening your first issue here! Clear steps to reproduce, what you expected and what actually happened, plus any logs, make it much faster to look into.
          pr_message: |
            🎉 Thanks for your first pull request! CI and an automated review will run shortly. Please make sure the tests pass, and describe *why* the change is needed as well as what it does.
